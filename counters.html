
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartQueue - Counter Management</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            margin: 0;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 { color: #1e40af; }

        .back-btn, .add-btn {
            background: #2563eb;
            color: white;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }

        .section {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        input {
            padding: 12px;
            margin: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .active {
            color: #16a34a;
            font-weight: bold;
        }

        .inactive {
            color: #dc2626;
            font-weight: bold;
        }

        .status-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            background: #475569;
            color: white;
            cursor: pointer;
        }

        @media(max-width: 600px) {
            .section { overflow-x: auto; }
            table { min-width: 550px; }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Counter Management</h1>

        <a href="{{ url_for('admin_dashboard') }}" class="back-btn">
            Back to Admin
        </a>
    </div>

    <!-- Add Counter -->
    <div class="section">

        <h2>Add New Counter</h2>

        <form method="POST" action="{{ url_for('manage_counters') }}">

            <input
                type="text"
                name="counter_name"
                placeholder="Enter Counter Name"
                required
            >

            <input
                type="number"
                name="counter_number"
                placeholder="Counter Number"
                min="1"
                required
            >

            <button type="submit" class="add-btn">
                Add Counter
            </button>

        </form>

    </div>

    <!-- Counter List -->
    <div class="section">

        <h2>All Counters</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Counter Name</th>
                <th>Counter Number</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

            {% for counter in counters %}

            <tr>
                <td>{{ counter.id }}</td>
                <td>{{ counter.counter_name }}</td>
                <td>{{ counter.counter_number }}</td>

                <td class="{{ counter.status }}">
                    {{ counter.status|capitalize }}
                </td>

                <td>
                    <form method="POST"
                          action="{{ url_for('update_counter', counter_id=counter.id) }}">

                        <button type="submit" class="status-btn">
                            Change Status
                        </button>

                    </form>
                </td>
            </tr>

            {% else %}

            <tr>
                <td colspan="5">No counters available.</td>
            </tr>

            {% endfor %}

        </table>

    </div>

</div>

</body>
</html>
